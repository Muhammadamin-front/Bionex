<!doctype html>
<html lang="uz-Cyrl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Зейнара · Лидлар жадвали</title>
<style>
  /*
   * The operators' CRM, drawn like a spreadsheet: column letters, row numbers, cell grid,
   * a frozen header row, a formula bar showing the selected cell and sheet tabs at the bottom.
   * The owner reads the partner site's Google Sheet every day, so the panel copies that look:
   * nothing new to learn, and the same columns in the same order.
   */
  :root {
    --paper: #ffffff;
    --chrome: #f9fbfd;      /* the area around the grid */
    --bar: #ffffff;
    --grid: #e1e3e1;        /* cell lines */
    --grid-strong: #c0c0c0; /* frozen-row line */
    --head-bg: #f8f9fa;     /* column letters / row numbers */
    --head-text: #5f6368;
    --head-sel: #d3e3fd;
    --ink: #202124;
    --ink2: #5f6368;
    --line: #dadce0;
    --accent: #1a73e8;      /* selection blue */
    --green: #0d652d;
    --green-bg: #e6f4ea;
    --red: #c5221f;
    --red-bg: #fce8e6;
    --amber: #b06000;
    --amber-bg: #fef7e0;
    --blue: #1967d2;
    --blue-bg: #e8f0fe;
    --violet: #8430ce;
    --violet-bg: #f3e8fd;
    --gray: #3c4043;
    --gray-bg: #e8eaed;
    --flag-row: #fff8e1;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--chrome);
    color: var(--ink);
    font: 13px/1.35 Roboto, Arial, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  /* ── Window chrome ─────────────────────────────────────────────── */
  .app { display: flex; flex-direction: column; height: 100%; }

  .titlebar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px 2px;
    background: var(--bar);
  }
  .logo { width: 26px; height: 26px; flex: none; }
  .title-main { min-width: 0; flex: 1; }
  .docname {
    font-size: 16px;
    line-height: 20px;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .menubar { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; margin-top: 1px; }
  .menubar .label { font-size: 12px; color: var(--ink2); padding: 0 4px; }
  .menubar button {
    border: 0;
    background: transparent;
    color: var(--ink2);
    font: inherit;
    font-size: 12px;
    padding: 3px 7px;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
  }
  .menubar button:hover { background: #f1f3f4; }
  .menubar button.on { background: var(--green-bg); color: var(--green); font-weight: 500; }
  .whoami { font-size: 12px; color: var(--ink2); white-space: nowrap; text-align: right; }

  /* ── Toolbar ───────────────────────────────────────────────────── */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
    padding: 5px 10px;
    background: var(--bar);
    border-bottom: 1px solid var(--line);
  }
  .tbtn {
    border: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    padding: 5px 9px;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .tbtn:hover { background: #f1f3f4; }
  .tbtn.on { background: var(--blue-bg); color: var(--blue); }
  .tbtn[hidden] { display: none; }
  .sep { width: 1px; height: 20px; background: var(--line); margin: 0 3px; flex: none; }
  .find {
    flex: 1 1 180px;
    min-width: 140px;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 5px 9px;
    font: inherit;
    font-size: 13px;
    background: var(--paper);
    color: var(--ink);
  }
  .find:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
  .pick {
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 5px 6px;
    font: inherit;
    font-size: 12px;
    background: var(--paper);
    color: var(--ink);
    max-width: 180px;
  }

  /* ── Formula bar ───────────────────────────────────────────────── */
  .fxbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 10px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    min-height: 30px;
  }
  .fxcell {
    font-size: 12px;
    color: var(--ink2);
    min-width: 46px;
    border-right: 1px solid var(--line);
    padding-right: 8px;
    white-space: nowrap;
  }
  .fxfx { color: var(--ink2); font-style: italic; }
  .fxval {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--ink);
  }

  /* ── Grid ──────────────────────────────────────────────────────── */
  .gridwrap {
    flex: 1;
    overflow: auto;
    background: var(--chrome);
    -webkit-overflow-scrolling: touch;
  }
  .notice {
    background: var(--amber-bg);
    color: var(--amber);
    padding: 7px 12px;
    font-size: 12px;
    border-bottom: 1px solid var(--line);
  }
  .sheet-title {
    padding: 10px 12px 4px;
    font-size: 12px;
    color: var(--ink2);
  }
  table.grid {
    border-collapse: separate;
    border-spacing: 0;
    table-layout: fixed;
    background: var(--paper);
    font-size: 13px;
  }
  table.grid td, table.grid th {
    border-right: 1px solid var(--grid);
    border-bottom: 1px solid var(--grid);
    padding: 4px 6px;
    text-align: left;
    font-weight: 400;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    vertical-align: middle;
    height: 26px;
  }
  /* column letters (A, B, C …) */
  table.grid thead tr.letters th {
    position: sticky;
    top: 0;
    z-index: 3;
    background: var(--head-bg);
    color: var(--head-text);
    font-size: 11px;
    text-align: center;
    height: 20px;
    padding: 1px 2px;
    cursor: default;
    user-select: none;
  }
  table.grid thead tr.letters th.sel { background: var(--head-sel); color: var(--accent); font-weight: 500; }
  /* the frozen header row (sheet row 1) */
  table.grid thead tr.names th {
    position: sticky;
    top: 20px;
    z-index: 3;
    background: var(--head-bg);
    color: var(--ink);
    font-weight: 500;
    font-size: 12px;
    border-bottom: 2px solid var(--grid-strong);
    cursor: pointer;
    user-select: none;
  }
  table.grid thead tr.names th:hover { background: #f1f3f4; }
  table.grid thead tr.names th .sortmark { color: var(--accent); font-size: 10px; }
  /* row numbers (1, 2, 3 …) */
  table.grid .gut {
    position: sticky;
    left: 0;
    z-index: 2;
    background: var(--head-bg);
    color: var(--head-text);
    font-size: 11px;
    text-align: center;
    width: 44px;
    padding: 1px 2px;
    user-select: none;
    cursor: default;
  }
  table.grid .gut.sel { background: var(--head-sel); color: var(--accent); font-weight: 500; }
  table.grid thead .gut { z-index: 4; }
  table.grid tbody td.cell { cursor: cell; }
  table.grid tbody tr.flagged td.cell { background: var(--flag-row); }
  table.grid tbody tr.picked td.cell { background: #f0f5fb; }
  table.grid td.cell.sel {
    box-shadow: inset 0 0 0 2px var(--accent);
    background: var(--paper) !important;
  }
  body.wrap table.grid tbody td.cell { white-space: normal; vertical-align: top; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .muted { color: #9aa0a6; }
  .strong { font-weight: 500; }
  .link { color: var(--accent); text-decoration: none; }
  .link:hover { text-decoration: underline; }
  .copy {
    border: 0;
    background: transparent;
    color: var(--ink2);
    font: inherit;
    font-size: 12px;
    padding: 0 3px;
    border-radius: 3px;
    cursor: pointer;
  }
  .copy:hover { background: #f1f3f4; color: var(--ink); }
  .warnmark { color: var(--amber); }
  .suspect { color: var(--red); }

  /* A cell that behaves like a Sheets data-validation dropdown */
  .chip {
    -webkit-appearance: none;
    appearance: none;
    border: 0;
    border-radius: 999px;
    padding: 3px 20px 3px 9px;
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    max-width: 100%;
    cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: right 9px center, right 5px center;
    background-size: 4px 4px, 4px 4px;
    background-repeat: no-repeat;
  }
  .chip:disabled { opacity: .75; cursor: default; }
  .c-wait { background-color: var(--amber-bg); color: var(--amber); }
  .c-work { background-color: var(--blue-bg); color: var(--blue); }
  .c-callback { background-color: var(--violet-bg); color: var(--violet); }
  .c-noanswer { background-color: var(--gray-bg); color: var(--gray); }
  .c-sold { background-color: var(--green-bg); color: var(--green); }
  .c-rejected { background-color: var(--red-bg); color: var(--red); }
  .c-spam { background-color: #3c4043; color: #ffffff; }

  /* conversion bar inside a cell */
  .bar { display: flex; align-items: center; gap: 6px; }
  .bar .track { flex: 1; height: 6px; background: var(--gray-bg); border-radius: 999px; overflow: hidden; min-width: 28px; }
  .bar .fill { height: 100%; background: #34a853; }
  .bar .val { font-variant-numeric: tabular-nums; font-weight: 500; min-width: 34px; text-align: right; }

  /* ── Sheet tabs + status bar ───────────────────────────────────── */
  .sheetbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 10px;
    background: var(--bar);
    border-top: 1px solid var(--line);
    padding-bottom: calc(4px + env(safe-area-inset-bottom));
    overflow-x: auto;
    scrollbar-width: none;
  }
  .sheetbar::-webkit-scrollbar { display: none; }
  .tabs { display: flex; gap: 2px; flex: none; }
  .tabs button {
    border: 0;
    background: transparent;
    color: var(--ink2);
    font: inherit;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 6px 6px 0 0;
    cursor: pointer;
    white-space: nowrap;
  }
  .tabs button:hover { background: #f1f3f4; }
  .tabs button.on { background: var(--green-bg); color: var(--green); font-weight: 500; }
  .sum {
    margin-left: auto;
    font-size: 12px;
    color: var(--ink2);
    white-space: nowrap;
    display: flex;
    gap: 10px;
    flex: none;
    padding-left: 10px;
  }
  .sum b { color: var(--ink); font-weight: 500; }

  /* ── Sign-in / messages / toast ────────────────────────────────── */
  .msg { padding: 28px 16px; text-align: center; color: var(--ink2); }
  .login {
    max-width: 520px;
    margin: 40px auto;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 22px;
    text-align: center;
  }
  .login h2 { margin: 0 0 8px; font-size: 17px; font-weight: 500; }
  .login p { color: var(--ink2); margin: 0 0 14px; line-height: 1.5; }
  .login .row { display: flex; gap: 8px; }
  .login input { flex: 1; border: 1px solid var(--line); border-radius: 4px; padding: 9px 10px; font: inherit; }
  .login button { border: 0; background: #0b8043; color: #fff; border-radius: 4px; padding: 9px 16px; font: inherit; font-weight: 500; cursor: pointer; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(56px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    background: #3c4043;
    color: #fff;
    padding: 10px 16px;
    border-radius: 4px;
    font-size: 13px;
    max-width: 90vw;
    opacity: 0;
    transition: opacity .18s;
    pointer-events: none;
    z-index: 50;
  }
  .toast.on { opacity: 1; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div class="app">
  <div class="titlebar">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="2" y="2" width="20" height="20" rx="3" fill="#0f9d58"></rect>
      <g fill="#ffffff">
        <rect x="5.5" y="6" width="13" height="2"></rect>
        <rect x="5.5" y="10" width="13" height="1.6"></rect>
        <rect x="5.5" y="13.4" width="13" height="1.6"></rect>
        <rect x="5.5" y="16.8" width="13" height="1.6"></rect>
        <rect x="11.2" y="6" width="1.6" height="12"></rect>
      </g>
    </svg>
    <div class="title-main">
      <div class="docname">Зейнара · Лидлар жадвали</div>
      <div class="menubar" id="period">
        <span class="label">Давр:</span>
        <button type="button" data-days="1" class="on">Бугун</button>
        <button type="button" data-days="3">3 кун</button>
        <button type="button" data-days="7">7 кун</button>
        <button type="button" data-days="14">14 кун</button>
        <button type="button" data-days="30">30 кун</button>
      </div>
    </div>
    <div class="whoami" id="updated"></div>
  </div>

  <div class="toolbar">
    <button class="tbtn" id="refreshBtn" type="button" title="Янгилаш">🔄 Янгилаш</button>
    <button class="tbtn" id="csvBtn" type="button" title="CSV (Excel / Google Sheets)">📥 CSV</button>
    <button class="tbtn" id="wrapBtn" type="button" title="Матнни ўраш">↕ Матнни ўраш</button>
    <button class="tbtn" id="archiveBtn" type="button" title="Жорий буюртмаларни архивга ўтказиш">🧹 Тозалаш</button>
    <span class="sep"></span>
    <input class="find" id="find" type="search" placeholder="🔍 Исм, телефон, №, видео, ad set…">
    <select class="pick" id="fStatus" title="Ҳолат бўйича фильтр"></select>
    <select class="pick" id="fCampaign" title="Кампания бўйича фильтр"></select>
    <select class="pick" id="fAdset" title="Ad set бўйича фильтр"></select>
    <select class="pick" id="fAd" title="Видео бўйича фильтр"></select>
    <select class="pick" id="fOperator" title="Оператор бўйича фильтр"></select>
    <button class="tbtn" id="clearBtn" type="button" hidden>✖ Фильтрни тозалаш</button>
  </div>

  <div class="fxbar">
    <span class="fxcell" id="fxCell">A1</span>
    <span class="fxfx">fx</span>
    <span class="fxval" id="fxVal">Катакни босинг — тўлиқ матни шу ерда кўринади</span>
  </div>

  <div class="gridwrap" id="gridwrap"><div class="msg">Юкланмоқда…</div></div>

  <div class="sheetbar">
    <div class="tabs" id="tabs">
      <button type="button" data-sheet="leads" class="on">📋 Лидлар</button>
      <button type="button" data-sheet="target">🎯 Таргет</button>
      <button type="button" data-sheet="archive">🗄 Архив</button>
    </div>
    <div class="sum" id="sum"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script nonce="{{NONCE}}">
(function () {
  'use strict';

  function post(type, data) {
    var payload = data || {};
    try {
      if (window.TelegramWebviewProxy && window.TelegramWebviewProxy.postEvent) window.TelegramWebviewProxy.postEvent(type, JSON.stringify(payload));
      else if (window.external && 'notify' in window.external) window.external.notify(JSON.stringify({ eventType: type, eventData: payload }));
      else if (window.parent !== window) window.parent.postMessage(JSON.stringify({ eventType: type, eventData: payload }), '*');
    } catch (e) { /* plain browser tab */ }
  }

  var hash = new URLSearchParams(location.hash.slice(1));
  var query = new URLSearchParams(location.search);
  var initData = hash.get('tgWebAppData') || '';
  var webKey = query.get('key') || '';

  try {
    if (initData) sessionStorage.setItem('initData', initData);
    else initData = sessionStorage.getItem('initData') || '';
    if (webKey) {
      localStorage.setItem('bx_crm_key', webKey);
      query.delete('key');
      var cleanUrl = location.pathname + (query.toString() ? '?' + query.toString() : '') + location.hash;
      history.replaceState(null, '', cleanUrl);
    } else {
      webKey = localStorage.getItem('bx_crm_key') || '';
    }
  } catch (e) { /* storage blocked */ }

  // A spreadsheet is white paper: Telegram's theme colours are deliberately not applied here.
  post('web_app_ready'); post('web_app_expand');

  var STATUS = {
    wait: ['⏳ Олинмаган', 'c-wait', 1],
    work: ['📞 Жараёнда', 'c-work', 2],
    callback: ['⏰ Кейинроқ', 'c-callback', 3],
    noanswer: ['🔁 Кўтармади', 'c-noanswer', 4],
    sold: ['✅ Сотилди', 'c-sold', 5],
    rejected: ['❌ Рад этди', 'c-rejected', 6],
    spam: ['🚫 Спам', 'c-spam', 7]
  };
  // What an operator can choose in the «Ҳолат» cell, in the order of a real call.
  var CHOICES = [
    ['take', '📞 Жараёнда (мен оламан)'],
    ['sold', '✅ Сотилди'],
    ['rejected', '❌ Рад этди'],
    ['noanswer', '🔁 Кўтармади'],
    ['callback', '⏰ Кейинроқ'],
    ['spam', '🚫 Спам'],
    ['release', '⏳ Олинмаган (бўшатиш)']
  ];
  var STATUS_FILTERS = [
    ['', 'Ҳолат: Ҳаммаси'],
    ['wait', '⏳ Олинмаган'],
    ['mine', '👤 Менда'],
    ['work', '📞 Жараёнда'],
    ['callback', '⏰ Кейинроқ'],
    ['noanswer', '🔁 Кўтармади'],
    ['sold', '✅ Сотилди'],
    ['rejected', '❌ Рад этди'],
    ['spam', '🚫 Спам / шубҳали']
  ];

  var state = {
    days: 1,
    sheet: 'leads',      // 'leads' | 'target' | 'archive'
    q: '',
    fStatus: '',
    fCampaign: '',
    fAdset: '',
    fAd: '',
    fOperator: '',
    targetGroup: 'all',  // 'all' | 'adset' | 'ad' | 'campaign'
    targetSortBy: 'sold',
    targetSortDir: 'desc',
    leadSortBy: 'number',
    leadSortDir: 'desc',
    wrap: false,
    data: null,
    busy: false,
    sel: null            // { r, c } inside the current grid
  };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function letter(i) {
    var s = '';
    i += 1;
    while (i > 0) {
      var r = (i - 1) % 26;
      s = String.fromCharCode(65 + r) + s;
      i = Math.floor((i - 1) / 26);
    }
    return s;
  }
  function statusOf(l) { return l.outcome || (l.takerId ? 'work' : 'wait'); }

  var timeFmt = new Intl.DateTimeFormat('ru-RU', { timeZone: 'Asia/Tashkent', hour: '2-digit', minute: '2-digit' });
  var dayFmt = new Intl.DateTimeFormat('ru-RU', { timeZone: 'Asia/Tashkent', day: '2-digit', month: '2-digit', year: 'numeric' });
  function when(ms) {
    var d = new Date(ms);
    return dayFmt.format(d) + ', ' + timeFmt.format(d);
  }
  function prettyPhone(p) {
    var d = p.replace(/\D/g, '');
    return '+' + d.slice(0, 3) + ' ' + d.slice(3, 5) + ' ' + d.slice(5, 8) + ' ' + d.slice(8, 10) + ' ' + d.slice(10, 12);
  }

  var toastTimer;
  function toast(text) {
    var t = document.getElementById('toast');
    t.textContent = text;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('on'); }, 2600);
  }

  function copy(text, label) {
    function fallback() {
      var a = document.createElement('textarea');
      a.value = text;
      a.style.position = 'fixed';
      a.style.opacity = '0';
      document.body.appendChild(a);
      a.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(a);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(fallback);
    else fallback();
    post('web_app_trigger_haptic_feedback', { type: 'notification', notification_type: 'success' });
    toast(label || 'Рақам нусхаланди');
  }

  function authHeader() {
    if (initData) return 'tma ' + initData;
    if (webKey) return 'web ' + webKey;
    return '';
  }

  function api(path, opts) {
    opts = opts || {};
    var hdr = authHeader();
    opts.headers = Object.assign(hdr ? { authorization: hdr } : {}, opts.headers || {});
    return fetch(path, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (body) {
        if (!r.ok) {
          body._status = r.status;
          throw body;
        }
        return body;
      });
    });
  }

  function fx(cellName, value) {
    document.getElementById('fxCell').textContent = cellName;
    document.getElementById('fxVal').textContent = value;
  }

  function showLoginPrompt(errMsg) {
    var m = document.getElementById('gridwrap');
    m.textContent = '';
    var box = el('div', 'login');
    box.appendChild(el('h2', '', '🔐 Жадвалга кириш'));
    box.appendChild(
      el(
        'p',
        '',
        errMsg ||
          'Жадвални катта экранда (компьютер ёки браузерда) очиш учун Telegram гуруҳида ёки ботга шахсий хабарда /panel деб ёзинг ва «🖥 Катта экранда очиш» тугмасини босинг.'
      )
    );
    var row = el('div', 'row');
    var inp = el('input');
    inp.type = 'text';
    inp.placeholder = 'Ҳавола ёки калит (?key=…)';
    var btn = el('button', '', 'Кириш');
    btn.onclick = function () {
      var val = inp.value.trim();
      if (!val) return;
      try {
        if (val.indexOf('key=') >= 0) {
          var u = new URL(val, location.origin);
          val = u.searchParams.get('key') || val;
        }
      } catch (e) { /* not a URL */ }
      webKey = val;
      try { localStorage.setItem('bx_crm_key', webKey); } catch (e) {}
      load();
    };
    row.appendChild(inp);
    row.appendChild(btn);
    box.appendChild(row);
    m.appendChild(box);
  }

  function load() {
    var archive = state.sheet === 'archive';
    api('/api/panel/data?days=' + state.days + (archive ? '&archive=1' : ''))
      .then(function (d) {
        state.data = d;
        state.sel = null;
        render();
        var tabBtn = document.querySelector('#tabs button[data-sheet="archive"]');
        if (tabBtn) tabBtn.textContent = '🗄 Архив' + (d.archived ? ' (' + d.archived + ')' : '');
        document.getElementById('archiveBtn').hidden = archive;
        document.getElementById('updated').textContent =
          (d.me && d.me.name ? '👤 ' + d.me.name + ' · ' : '') + 'янгиланди ' + timeFmt.format(new Date());
      })
      .catch(function (e) {
        if (e && (e._status === 401 || e.error === 'unauthorized')) {
          showLoginPrompt('Жадвални Telegram ичида гуруҳдаги тугма орқали очинг ёки ботга /panel деб ёзиб «🖥 Катта экранда очиш» ҳаволасини олинг.');
        } else {
          var m = document.getElementById('gridwrap');
          m.textContent = '';
          m.appendChild(el('div', 'msg', (e && e.message) || 'Маълумотни олиб бўлмади. Интернетни текширинг.'));
        }
      });
  }

  function act(lead, action) {
    if (state.busy) return;
    state.busy = true;
    post('web_app_trigger_haptic_feedback', { type: 'impact', impact_style: 'light' });
    api('/api/panel/action', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ leadId: lead.number, action: action })
    })
      .then(function (r) { toast(r.message || 'Тайёр'); })
      .catch(function (e) { toast((e && e.message) || 'Бажариб бўлмади'); })
      .then(function () { state.busy = false; load(); });
  }

  function resetFilters() {
    state.fStatus = '';
    state.fCampaign = '';
    state.fAdset = '';
    state.fAd = '';
    state.fOperator = '';
    state.q = '';
  }

  function archiveAll() {
    if (state.busy) return;
    if (!window.confirm('Ҳозирги барча буюртмалар архивга ўтказилсинми?\n\nЖадвал тозаланади, янги ad set лар бўйича статистика нолдан бошланади. Архивдаги буюртмаларни пастдаги «🗄 Архив» варағида кўриш ва ҳолатини ўзгартириш мумкин. Telegram гуруҳдаги хабарлар ўзгармайди.')) return;
    state.busy = true;
    api('/api/panel/archive', { method: 'POST' })
      .then(function (r) {
        toast((r.message || 'Тайёр') + (r.open ? ' Улардан ' + r.open + ' таси ҳали якунланмаган — архивда.' : ''));
      })
      .catch(function (e) { toast((e && e.message) || 'Бажариб бўлмади'); })
      .then(function () { state.busy = false; resetFilters(); load(); });
  }

  function filteredLeads(leads) {
    var q = state.q.trim().toLowerCase();
    var digits = q.replace(/\D/g, '');
    var me = state.data && state.data.me ? state.data.me.id : 0;

    var list = leads.filter(function (l) {
      var s = statusOf(l);
      if (state.fStatus === 'mine' && l.takerId !== me) return false;
      if (state.fStatus === 'spam' && !(s === 'spam' || l.flagged)) return false;
      if (['wait', 'work', 'sold', 'noanswer', 'callback', 'rejected'].indexOf(state.fStatus) >= 0 && s !== state.fStatus) return false;

      if (state.fCampaign && (l.campaign || '—') !== state.fCampaign) return false;
      if (state.fAdset && (l.adset || '—') !== state.fAdset) return false;
      if (state.fAd && (l.ad || '—') !== state.fAd) return false;
      if (state.fOperator && (l.takerName || '—') !== state.fOperator) return false;

      if (q) {
        var hay = [
          l.name, l.phone, String(l.number), l.source || '', l.platform || '',
          l.campaign || '', l.adset || '', l.ad || '', l.device || '', l.details || '', l.takerName || ''
        ].join(' ').toLowerCase();
        var matchText = hay.indexOf(q) >= 0;
        var matchDigits = digits.length >= 3 && l.phone.indexOf(digits) >= 0;
        var matchNum = String(l.number) === q.replace('№', '');
        if (!matchText && !matchDigits && !matchNum) return false;
      }
      return true;
    });

    var dir = state.leadSortDir === 'asc' ? 1 : -1;
    var col = state.leadSortBy;
    list.sort(function (a, b) {
      var va, vb;
      if (col === 'number') { va = a.number; vb = b.number; }
      else if (col === 'createdAt') { va = a.createdAt; vb = b.createdAt; }
      else if (col === 'name') { va = a.name.toLowerCase(); vb = b.name.toLowerCase(); }
      else if (col === 'phone') { va = a.phone; vb = b.phone; }
      else if (col === 'campaign') { va = (a.campaign || '').toLowerCase(); vb = (b.campaign || '').toLowerCase(); }
      else if (col === 'adset') { va = (a.adset || '').toLowerCase(); vb = (b.adset || '').toLowerCase(); }
      else if (col === 'ad') { va = (a.ad || '').toLowerCase(); vb = (b.ad || '').toLowerCase(); }
      else if (col === 'platform') { va = (a.platform || a.source || '').toLowerCase(); vb = (b.platform || b.source || '').toLowerCase(); }
      else if (col === 'device') { va = (a.device || '').toLowerCase(); vb = (b.device || '').toLowerCase(); }
      else if (col === 'details') { va = (a.details || '').toLowerCase(); vb = (b.details || '').toLowerCase(); }
      else if (col === 'flag') { va = a.flagged ? 1 : 0; vb = b.flagged ? 1 : 0; }
      else if (col === 'status') { va = STATUS[statusOf(a)][2]; vb = STATUS[statusOf(b)][2]; }
      else if (col === 'operator') { va = (a.takerName || '').toLowerCase(); vb = (b.takerName || '').toLowerCase(); }
      else { va = a.number; vb = b.number; }
      if (va < vb) return -1 * dir;
      if (va > vb) return 1 * dir;
      return b.number - a.number;
    });
    return list;
  }

  function buildTargetRows(leads) {
    var map = {};
    leads.forEach(function (l) {
      var platform = l.platform || (l.source ? l.source.split(' · ')[0] : 'Тўғридан-тўғри');
      var campaign = l.campaign || '—';
      var adset = l.adset || '—';
      var ad = l.ad || '—';
      var key;
      if (state.targetGroup === 'campaign') {
        key = platform + '\0' + campaign;
        adset = 'Барчаси';
        ad = 'Барчаси';
      } else if (state.targetGroup === 'adset') {
        key = platform + '\0' + campaign + '\0' + adset;
        ad = 'Барчаси';
      } else if (state.targetGroup === 'ad') {
        key = platform + '\0' + ad;
      } else {
        key = platform + '\0' + campaign + '\0' + adset + '\0' + ad;
      }
      if (!map[key]) {
        map[key] = { platform: platform, campaign: campaign, adset: adset, ad: ad, total: 0, wait: 0, work: 0, sold: 0, rejected: 0, noanswer: 0, callback: 0, spam: 0 };
      }
      var r = map[key];
      r.total++;
      var s = statusOf(l);
      if (s === 'wait') r.wait++;
      else if (s === 'work') r.work++;
      else if (s === 'sold') r.sold++;
      else if (s === 'rejected') r.rejected++;
      else if (s === 'noanswer') r.noanswer++;
      else if (s === 'callback') r.callback++;
      else if (s === 'spam') r.spam++;
    });

    var rows = Object.keys(map).map(function (k) {
      var r = map[k];
      r.real = r.total - r.spam;
      r.pending = r.wait + r.work + r.noanswer + r.callback;
      r.conversion = r.real > 0 ? Math.round((r.sold / r.real) * 100) : 0;
      return r;
    });

    var dir = state.targetSortDir === 'asc' ? 1 : -1;
    var col = state.targetSortBy;
    rows.sort(function (a, b) {
      var va = a[col], vb = b[col];
      if (typeof va === 'string') { va = va.toLowerCase(); vb = String(vb).toLowerCase(); }
      if (va < vb) return -1 * dir;
      if (va > vb) return 1 * dir;
      return b.sold - a.sold || b.total - a.total;
    });
    return rows;
  }

  function uniqueValues(leads, field) {
    var set = {};
    leads.forEach(function (l) { if (l[field]) set[l[field]] = true; });
    return Object.keys(set).sort();
  }

  /* ── The spreadsheet renderer ────────────────────────────────────
   * cols: [{ key, label, w, sortable }]
   * rows: [{ cls, cells: [{ text, cls, node, title, fxText }] }]
   * Draws column letters, row numbers, a frozen header row and a selectable cell grid.
   */
  function drawGrid(container, cols, rows, onSort, sortBy, sortDir, primary) {
    var table = el('table', 'grid');
    var cg = el('colgroup');
    var gutCol = el('col');
    gutCol.style.width = '44px';
    cg.appendChild(gutCol);
    cols.forEach(function (c) {
      var col = el('col');
      col.style.width = (c.w || 120) + 'px';
      cg.appendChild(col);
    });
    table.appendChild(cg);

    var thead = el('thead');
    var lr = el('tr', 'letters');
    var corner = el('th', 'gut');
    lr.appendChild(corner);
    cols.forEach(function (c, i) {
      var th = el('th', '', letter(i));
      th.setAttribute('data-letter', String(i));
      lr.appendChild(th);
    });
    thead.appendChild(lr);

    var nr = el('tr', 'names');
    nr.appendChild(el('th', 'gut', ''));
    cols.forEach(function (c, i) {
      var th = el('th');
      th.appendChild(document.createTextNode(c.label));
      if (sortBy === c.key) {
        var m = el('span', 'sortmark', sortDir === 'asc' ? ' ▲' : ' ▼');
        th.appendChild(m);
      }
      th.title = c.sortable === false ? c.label : c.label + ' — саралаш учун босинг';
      if (c.sortable !== false && onSort) th.onclick = function () { onSort(c.key); };
      else th.style.cursor = 'default';
      nr.appendChild(th);
    });
    thead.appendChild(nr);
    table.appendChild(thead);

    var tbody = el('tbody');
    if (!rows.length) {
      var tr0 = el('tr');
      tr0.appendChild(el('td', 'gut', '2'));
      var td0 = el('td', 'muted', 'Маълумот йўқ.');
      td0.colSpan = cols.length;
      tr0.appendChild(td0);
      tbody.appendChild(tr0);
    }
    rows.forEach(function (row, ri) {
      var tr = el('tr', row.cls || '');
      var gut = el('td', 'gut', String(ri + 2)); // sheet row 1 is the header
      gut.setAttribute('data-row', String(ri));
      tr.appendChild(gut);
      row.cells.forEach(function (cell, ci) {
        var td = el('td', 'cell' + (cell.cls ? ' ' + cell.cls : ''));
        if (cell.node) td.appendChild(cell.node);
        else td.textContent = cell.text == null ? '' : String(cell.text);
        var full = cell.fxText != null ? cell.fxText : (cell.text == null ? '' : String(cell.text));
        td.title = cell.title != null ? cell.title : full;
        td.setAttribute('data-r', String(ri));
        td.setAttribute('data-c', String(ci));
        td.setAttribute('data-fx', full);
        tr.appendChild(td);
      });
      if (row.onOpen) tr.addEventListener('dblclick', row.onOpen);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    table.addEventListener('click', function (e) {
      var td = e.target.closest ? e.target.closest('td.cell') : null;
      if (!td) return;
      select(table, Number(td.getAttribute('data-r')), Number(td.getAttribute('data-c')));
    });

    table.setAttribute('data-primary', primary === false ? '0' : '1');
    container.appendChild(table);
    if (primary !== false && state.sel) select(table, state.sel.r, state.sel.c, true);
    return table;
  }

  function select(table, r, c, quiet) {
    Array.prototype.forEach.call(table.querySelectorAll('.sel'), function (x) { x.classList.remove('sel'); });
    Array.prototype.forEach.call(table.querySelectorAll('tr.picked'), function (x) { x.classList.remove('picked'); });
    var td = table.querySelector('td.cell[data-r="' + r + '"][data-c="' + c + '"]');
    if (!td) { state.sel = null; return; }
    state.sel = { r: r, c: c };
    td.classList.add('sel');
    var tr = td.parentNode;
    tr.classList.add('picked');
    var gut = tr.querySelector('.gut');
    if (gut) gut.classList.add('sel');
    var lh = table.querySelector('tr.letters th[data-letter="' + c + '"]');
    if (lh) lh.classList.add('sel');
    fx(letter(c) + (r + 2), td.getAttribute('data-fx') || '');
    if (!quiet) td.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  /* ── Sheet 1 and 3: the leads ───────────────────────────────── */
  var LEAD_COLS = [
    { key: 'number', label: '№', w: 56 },
    { key: 'createdAt', label: 'Сана', w: 130 },
    { key: 'name', label: 'Исм', w: 150 },
    { key: 'phone', label: 'Телефон', w: 150 },
    { key: 'campaign', label: 'Кампания', w: 190 },
    { key: 'adset', label: 'Ad set', w: 110 },
    { key: 'ad', label: 'Видео', w: 90 },
    { key: 'flag', label: 'Белги', w: 190 },
    { key: 'status', label: 'Ҳолат', w: 180 },
    { key: 'operator', label: 'Оператор', w: 130 },
    { key: 'device', label: 'Қурилма', w: 160 },
    { key: 'details', label: 'Тафсилот', w: 260 },
    { key: 'platform', label: 'Манба', w: 110 }
  ];

  function statusCell(l, me) {
    var s = statusOf(l);
    var mine = l.takerId === me;
    var sel = el('select', 'chip ' + STATUS[s][1]);
    var cur = el('option', '', STATUS[s][0]);
    cur.value = '';
    sel.appendChild(cur);
    if (l.takerId && !mine) {
      // Someone else is on this call: only give it back, never overwrite their outcome.
      var rel = el('option', '', '⏳ Олинмаган (бўшатиш)');
      rel.value = 'release';
      sel.appendChild(rel);
      sel.title = 'Бу буюртмани ' + l.takerName + ' олган';
    } else {
      CHOICES.forEach(function (ch) {
        if (ch[0] === 'take' && (s === 'work' || mine)) return;
        if (ch[0] === 'release' && !l.takerId) return;
        if (ch[0] === s) return;
        var o = el('option', '', ch[1]);
        o.value = ch[0];
        sel.appendChild(o);
      });
    }
    sel.onchange = function () {
      var v = sel.value;
      sel.value = '';
      if (v) act(l, v);
    };
    return sel;
  }

  function phoneCell(l) {
    var wrap = document.createDocumentFragment();
    var a = el('a', 'link', prettyPhone(l.phone));
    a.href = 'tel:' + l.phone;
    var cp = el('button', 'copy', '⧉');
    cp.title = 'Рақамни нусхалаш';
    cp.onclick = function (e) { e.stopPropagation(); copy(l.phone); };
    wrap.appendChild(a);
    wrap.appendChild(cp);
    return wrap;
  }

  function flagText(l) {
    if (!l.flagged) return '';
    return '⚠️ Шубҳали';
  }

  function renderLeads(container) {
    var d = state.data;
    var leads = d.leads || [];
    var me = d.me ? d.me.id : 0;
    var list = filteredLeads(leads);

    var rows = list.map(function (l) {
      var s = statusOf(l);
      // The lines that mean "a program, not a person": a driven browser, a faked Chrome version,
      // a form nobody typed into. The rest of «Тафсилот» is ordinary device talk.
      var suspect = l.details && /webdriver|аслида|ҳеч нарса ёзилмаган/i.test(l.details);
      return {
        cls: l.flagged ? 'flagged' : '',
        cells: [
          { text: l.number, cls: 'num strong' },
          { text: when(l.createdAt) },
          { text: l.name, cls: 'strong' },
          { node: phoneCell(l), fxText: prettyPhone(l.phone) },
          { text: l.campaign || '', cls: l.campaign ? '' : 'muted' },
          { text: l.adset || '', cls: l.adset ? '' : 'muted' },
          { text: l.ad || '', cls: l.ad ? '' : 'muted' },
          { text: flagText(l), cls: 'warnmark' },
          { node: statusCell(l, me), fxText: STATUS[s][0] + (l.takerName ? ' · ' + l.takerName : '') },
          { text: l.takerName || '', cls: l.takerName ? '' : 'muted' },
          { text: l.device || '', cls: l.device ? '' : 'muted' },
          { text: l.details || '', cls: suspect ? 'suspect' : 'muted' },
          { text: l.platform || (l.source ? l.source.split(' · ')[0] : ''), cls: 'muted' }
        ]
      };
    });

    if (state.sheet === 'archive') {
      container.appendChild(el('div', 'notice', '🗄 Архив варағи: жадвал тозаланганда бу ерга ўтган буюртмалар (30 кундан кейин ўчирилади).'));
    }
    if (d.truncated) {
      container.appendChild(el('div', 'notice', '⚠️ Бу даврда буюртмалар жуда кўп — фақат охирги ' + leads.length + ' таси кўрсатилмоқда. Қисқароқ даврни танланг.'));
    }

    drawGrid(
      container,
      LEAD_COLS,
      rows,
      function (key) {
        if (state.leadSortBy === key) state.leadSortDir = state.leadSortDir === 'asc' ? 'desc' : 'asc';
        else { state.leadSortBy = key; state.leadSortDir = key === 'name' ? 'asc' : 'desc'; }
        render();
      },
      state.leadSortBy,
      state.leadSortDir
    );
  }

  /* ── Sheet 2: the target report ─────────────────────────────── */
  var TARGET_COLS = [
    { key: 'platform', label: 'Манба', w: 110 },
    { key: 'campaign', label: 'Кампания', w: 210 },
    { key: 'adset', label: 'Ad set', w: 120 },
    { key: 'ad', label: 'Видео', w: 100 },
    { key: 'total', label: 'Жами лид', w: 90 },
    { key: 'pending', label: '⏳ Кутилмоқда', w: 120 },
    { key: 'sold', label: '✅ Сотилди', w: 100 },
    { key: 'rejected', label: '❌ Рад этди', w: 105 },
    { key: 'spam', label: '🚫 Спам', w: 90 },
    { key: 'conversion', label: 'Конверсия', w: 130 }
  ];
  var SUMMARY_COLS = [
    { key: 'a', label: 'Жами буюртма', w: 120, sortable: false },
    { key: 'b', label: '⏳ Олинмаган', w: 120, sortable: false },
    { key: 'c', label: '📞 Жараёнда', w: 120, sortable: false },
    { key: 'd', label: '✅ Сотилди', w: 110, sortable: false },
    { key: 'e', label: '❌ Рад этди', w: 110, sortable: false },
    { key: 'f', label: '🚫 Спам', w: 100, sortable: false },
    { key: 'g', label: '📈 Конверсия', w: 120, sortable: false }
  ];

  function totals(leads) {
    var count = function (f) { return leads.filter(f).length; };
    var sold = count(function (l) { return l.outcome === 'sold'; });
    var spam = count(function (l) { return l.outcome === 'spam'; });
    var real = leads.length - spam;
    return {
      total: leads.length,
      wait: count(function (l) { return !l.takerId && !l.outcome; }),
      work: count(function (l) { var s = statusOf(l); return s === 'work' || s === 'callback' || s === 'noanswer'; }),
      sold: sold,
      rejected: count(function (l) { return l.outcome === 'rejected'; }),
      spam: spam,
      conv: real > 0 ? Math.round((sold / real) * 100) + '%' : '—'
    };
  }

  function renderTarget(container) {
    var leads = state.data.leads || [];
    var t = totals(leads);

    container.appendChild(el('div', 'sheet-title', 'Хулоса — танланган давр бўйича'));
    drawGrid(container, SUMMARY_COLS, [{
      cells: [
        { text: t.total, cls: 'num strong' },
        { text: t.wait, cls: 'num' },
        { text: t.work, cls: 'num' },
        { text: t.sold, cls: 'num strong' },
        { text: t.rejected, cls: 'num' },
        { text: t.spam, cls: 'num' },
        { text: t.conv, cls: 'num strong' }
      ]
    }], null, null, null, false);

    var head = el('div', 'sheet-title');
    head.appendChild(document.createTextNode('Кампания · Ad set · Видео самарадорлиги (қаторни 2 марта боссангиз — «Лидлар» варағи шу таргет бўйича фильтрланади) — гуруҳлаш: '));
    var seg = el('span');
    [
      ['all', 'Ҳаммаси'],
      ['adset', 'Ad set бўйича'],
      ['ad', 'Видео бўйича'],
      ['campaign', 'Кампания бўйича']
    ].forEach(function (g) {
      var b = el('button', 'tbtn' + (state.targetGroup === g[0] ? ' on' : ''), g[1]);
      b.onclick = function () { state.targetGroup = g[0]; state.sel = null; render(); };
      seg.appendChild(b);
    });
    head.appendChild(seg);
    container.appendChild(head);

    var rows = buildTargetRows(leads).map(function (r) {
      var bar = el('div', 'bar');
      var track = el('div', 'track');
      var fill = el('div', 'fill');
      fill.style.width = Math.min(100, r.conversion) + '%';
      track.appendChild(fill);
      bar.appendChild(track);
      bar.appendChild(el('span', 'val', r.real > 0 ? r.conversion + '%' : '—'));
      return {
        // Two clicks on a target row open the leads sheet filtered to it.
        onOpen: function () {
          state.fCampaign = r.campaign !== 'Барчаси' && r.campaign !== '—' ? r.campaign : '';
          state.fAdset = r.adset !== 'Барчаси' && r.adset !== '—' ? r.adset : '';
          state.fAd = r.ad !== 'Барчаси' && r.ad !== '—' ? r.ad : '';
          state.fStatus = '';
          state.q = '';
          state.sheet = 'leads';
          state.sel = null;
          render();
          toast('Лидлар варағи шу таргет бўйича фильтрланди');
        },
        cells: [
          { text: r.platform, cls: 'muted' },
          { text: r.campaign === '—' ? '' : r.campaign, cls: r.campaign === '—' ? 'muted' : '' },
          { text: r.adset === '—' ? '' : r.adset },
          { text: r.ad === '—' ? '' : r.ad, cls: 'strong' },
          { text: r.total, cls: 'num strong' },
          { text: r.pending, cls: 'num' },
          { text: r.sold, cls: 'num strong' },
          { text: r.rejected, cls: 'num' },
          { text: r.spam, cls: 'num' },
          { node: bar, cls: 'num', fxText: r.real > 0 ? r.conversion + '%' : '—' }
        ]
      };
    });

    drawGrid(
      container,
      TARGET_COLS,
      rows,
      function (key) {
        if (state.targetSortBy === key) state.targetSortDir = state.targetSortDir === 'asc' ? 'desc' : 'asc';
        else { state.targetSortBy = key; state.targetSortDir = 'desc'; }
        render();
      },
      state.targetSortBy,
      state.targetSortDir
    );
  }

  /* ── Toolbar / tabs / status bar ────────────────────────────── */
  function fillSelect(id, placeholder, values, current, onChange) {
    var sel = document.getElementById(id);
    sel.textContent = '';
    var o0 = el('option', '', placeholder);
    o0.value = '';
    sel.appendChild(o0);
    values.forEach(function (v) {
      var o = el('option', '', Array.isArray(v) ? v[1] : v);
      o.value = Array.isArray(v) ? v[0] : v;
      sel.appendChild(o);
    });
    if (current && !Array.prototype.some.call(sel.options, function (o) { return o.value === current; })) {
      var oc = el('option', '', current);
      oc.value = current;
      sel.appendChild(oc);
    }
    sel.value = current || '';
    sel.onchange = function () { onChange(sel.value); state.sel = null; render(); };
  }

  function renderToolbar() {
    var leads = (state.data && state.data.leads) || [];
    var onLeads = state.sheet !== 'target';
    ['fStatus', 'fCampaign', 'fAdset', 'fAd', 'fOperator'].forEach(function (id) {
      document.getElementById(id).hidden = !onLeads;
    });
    document.getElementById('find').hidden = !onLeads;
    document.getElementById('csvBtn').hidden = !onLeads;

    var me = state.data && state.data.me ? state.data.me.id : 0;
    var statusOptions = STATUS_FILTERS.slice(1).map(function (f) {
      var n = leads.filter(function (l) {
        var s = statusOf(l);
        if (f[0] === 'mine') return l.takerId === me;
        if (f[0] === 'spam') return s === 'spam' || l.flagged;
        return s === f[0];
      }).length;
      return [f[0], f[1] + ' (' + n + ')'];
    });
    fillSelect('fStatus', 'Ҳолат: Ҳаммаси (' + leads.length + ')', statusOptions, state.fStatus, function (v) { state.fStatus = v; });
    fillSelect('fCampaign', 'Кампания: Ҳаммаси', uniqueValues(leads, 'campaign'), state.fCampaign, function (v) { state.fCampaign = v; });
    fillSelect('fAdset', 'Ad set: Ҳаммаси', uniqueValues(leads, 'adset'), state.fAdset, function (v) { state.fAdset = v; });
    fillSelect('fAd', 'Видео: Ҳаммаси', uniqueValues(leads, 'ad'), state.fAd, function (v) { state.fAd = v; });
    fillSelect('fOperator', 'Оператор: Ҳаммаси', uniqueValues(leads, 'takerName'), state.fOperator, function (v) { state.fOperator = v; });

    var dirty = Boolean(state.q || state.fStatus || state.fCampaign || state.fAdset || state.fAd || state.fOperator);
    document.getElementById('clearBtn').hidden = !(dirty && onLeads);
    var find = document.getElementById('find');
    if (find.value !== state.q) find.value = state.q;
  }

  function renderSum() {
    var leads = (state.data && state.data.leads) || [];
    var shown = state.sheet === 'target' ? leads : filteredLeads(leads);
    var t = totals(shown);
    var bar = document.getElementById('sum');
    bar.textContent = '';
    [
      ['Қатор', t.total],
      ['⏳', t.wait],
      ['📞', t.work],
      ['✅', t.sold],
      ['❌', t.rejected],
      ['🚫', t.spam],
      ['📈', t.conv]
    ].forEach(function (p) {
      var s = el('span', '', p[0] + ': ');
      s.appendChild(el('b', '', String(p[1])));
      bar.appendChild(s);
    });
  }

  function render() {
    if (!state.data) return;
    var wrap = document.getElementById('gridwrap');
    wrap.textContent = '';
    renderToolbar();
    if (state.sheet === 'target') renderTarget(wrap);
    else renderLeads(wrap);
    renderSum();
    Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-sheet') === state.sheet);
    });
  }

  function exportCsv() {
    if (!state.data || !state.data.leads) return;
    var list = filteredLeads(state.data.leads);
    var headers = LEAD_COLS.map(function (c) { return c.label; });
    var rows = [headers.join(',')];
    list.forEach(function (l) {
      var cols = [
        l.number,
        when(l.createdAt),
        l.name,
        l.phone,
        l.campaign || '',
        l.adset || '',
        l.ad || '',
        l.flagged ? 'Шубҳали' : '',
        STATUS[statusOf(l)][0],
        l.takerName || '',
        l.device || '',
        l.details || '',
        l.platform || l.source || ''
      ].map(function (c) {
        var str = String(c == null ? '' : c);
        // A customer can type a name like =HYPERLINK(...): never let a spreadsheet read a cell as a formula.
        if (/^[=+\-@\t\r]/.test(str)) str = "'" + str;
        str = str.replace(/"/g, '""');
        return '"' + str + '"';
      });
      rows.push(cols.join(','));
    });
    var blob = new Blob(['\uFEFF' + rows.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'zeynara-lidlar-' + (state.sheet === 'archive' ? 'arxiv-' : '') + state.days + 'kun.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('CSV юклаб олинди — Google Sheets да очиш мумкин');
  }

  /* ── Wiring ─────────────────────────────────────────────────── */
  document.getElementById('period').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    state.days = Number(b.getAttribute('data-days'));
    Array.prototype.forEach.call(this.querySelectorAll('button'), function (x) { x.classList.toggle('on', x === b); });
    load();
  });
  document.getElementById('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    var next = b.getAttribute('data-sheet');
    if (next === state.sheet) return;
    var reload = (next === 'archive') !== (state.sheet === 'archive');
    state.sheet = next;
    state.sel = null;
    if (reload) { resetFilters(); load(); }
    else render();
  });
  document.getElementById('refreshBtn').addEventListener('click', function () { load(); });
  document.getElementById('csvBtn').addEventListener('click', function () { exportCsv(); });
  document.getElementById('archiveBtn').addEventListener('click', function () { archiveAll(); });
  document.getElementById('wrapBtn').addEventListener('click', function () {
    state.wrap = !state.wrap;
    document.body.classList.toggle('wrap', state.wrap);
    this.classList.toggle('on', state.wrap);
  });
  document.getElementById('clearBtn').addEventListener('click', function () {
    resetFilters();
    state.sel = null;
    render();
  });
  document.getElementById('find').addEventListener('input', function () {
    state.q = this.value;
    state.sel = null;
    render();
    document.getElementById('find').focus();
  });

  // Arrow keys walk the grid, as in a spreadsheet.
  document.addEventListener('keydown', function (e) {
    if (!state.sel) return;
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
    var map = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
    if (e.key === 'Escape') {
      var t0 = document.querySelector('.gridwrap table.grid[data-primary="1"]');
      if (t0) Array.prototype.forEach.call(t0.querySelectorAll('.sel, tr.picked'), function (x) { x.classList.remove('sel'); x.classList.remove('picked'); });
      state.sel = null;
      fx('—', '');
      return;
    }
    var mv = map[e.key];
    if (!mv) return;
    var table = document.querySelector('.gridwrap table.grid[data-primary="1"]');
    if (!table) return;
    e.preventDefault();
    select(table, Math.max(0, state.sel.r + mv[0]), Math.max(0, state.sel.c + mv[1]));
  });

  load();
  setInterval(function () { if (!document.hidden && !state.busy) load(); }, 30000);
})();
</script>
</body>
</html>
