<!doctype html>
<html lang="uz-Cyrl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Зейнара · Лидлар ва Таргет CRM Жадвали</title>
<style>
  :root {
    --bg: #ffffff;
    --bg2: #f4f6f9;
    --bg-hover: #f8fafc;
    --bg-selected: #e5e5e5;
    --text: #0f172a;
    --hint: #64748b;
    --link: #000000;
    --btn: #000000;
    --btn-text: #ffffff;
    --line: #e2e8f0;
    --ok: #000000;
    --ok-bg: #e5e5e5;
    --warn: #000000;
    --warn-bg: #e5e5e5;
    --bad: #000000;
    --bad-bg: #d4d4d4;
    --spam: #ffffff;
    --spam-bg: #000000;
    --wait: #525252;
    --wait-bg: #f1f1f1;
    --info: #000000;
    --info-bg: #ebebeb;
    --cb: #000000;
    --cb-bg: #e5e5e5;
    --grid: #d4d4d4;
    --head: #000000;
    --head-hover: #262626;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    background: var(--bg2);
    color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body { padding-bottom: calc(28px + env(safe-area-inset-bottom)); }

  /* Header */
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 10px 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  .header-inner {
    max-width: 1480px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand h1 { font-size: 18px; font-weight: 700; margin: 0; }
  .brand .meta { color: var(--hint); font-size: 12px; }
  .header-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .seg { display: inline-flex; background: var(--bg2); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button {
    border: 0;
    background: transparent;
    color: var(--text);
    border-radius: 8px;
    padding: 6px 11px;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }
  .seg button.on { background: var(--btn); color: var(--btn-text); font-weight: 600; }
  .tool-btn {
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    border-radius: 9px;
    padding: 6px 12px;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .tool-btn:hover { background: var(--bg-hover); }
  .tool-btn[hidden] { display: none; }

  /* Main Container */
  main {
    max-width: 1480px;
    margin: 0 auto;
    padding: 14px 16px;
  }

  /* Summary KPI Grid */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }
  .stat {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .stat b { display: block; font-size: 22px; font-weight: 700; line-height: 1.15; }
  .stat span { font-size: 12px; color: var(--hint); display: block; margin-top: 3px; }
  .stat.ok b { color: var(--ok); }
  .stat.warn b { color: var(--warn); }
  .stat.bad b { color: var(--bad); }
  .stat.spam b { color: var(--spam); }

  /* Section Box */
  .section-box {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .section-head {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .section-title {
    font-size: 15px;
    font-weight: 700;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-sub { font-size: 12px; color: var(--hint); font-weight: 400; }

  /* Tabs & Filter Bar */
  .tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--bg2);
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button {
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    border-radius: 999px;
    padding: 6px 12px;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    cursor: pointer;
  }
  .tabs button.on { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
  .tabs .n {
    display: inline-block;
    margin-left: 5px;
    padding: 1px 6px;
    border-radius: 999px;
    font-size: 11px;
    background: rgba(0,0,0,.07);
  }
  .tabs button.on .n { background: rgba(255,255,255,.22); color: #fff; }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    align-items: center;
  }
  .search {
    flex: 1 1 240px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    border-radius: 9px;
    padding: 8px 12px;
    font: inherit;
    font-size: 13px;
  }
  .select {
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    border-radius: 9px;
    padding: 8px 10px;
    font: inherit;
    font-size: 13px;
    max-width: 220px;
  }
  .active-filter-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--info-bg);
    color: var(--info);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 600;
  }
  .active-filter-chip button {
    border: 0;
    background: transparent;
    color: inherit;
    font-weight: 700;
    cursor: pointer;
    padding: 0 2px;
  }

  /* Data Tables */
  .table-wrap {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  /* Google Sheets ko‘rinishi: to‘q ko‘k sarlavha qatori va katak chiziqlari (grid) */
  table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
    font-size: 13px;
    border: 1px solid var(--grid);
    background: var(--bg);
  }
  th, td {
    padding: 7px 10px;
    border: 1px solid var(--grid);
    vertical-align: middle;
  }
  th {
    background: var(--head);
    color: #ffffff;
    font-weight: 600;
    font-size: 12px;
    white-space: nowrap;
    user-select: none;
    cursor: pointer;
    position: sticky;
    top: 0;
  }
  th:hover { background: var(--head-hover); }
  th.active-sort { background: var(--head-hover); color: #ffffff; }
  /* Sheet kabi juft/toq qatorlar */
  tbody tr:nth-child(even) { background: #f8fafc; }
  tbody tr:hover { background: var(--bg-hover); }
  tbody tr.selected-row { background: var(--bg-selected); }
  tbody tr.flagged-row { background: #ececec; }
  .num-cell { font-weight: 700; white-space: nowrap; color: var(--text); }
  .time-cell { white-space: nowrap; color: var(--hint); font-size: 12px; }
  .name-cell { font-weight: 600; min-width: 140px; }
  .flag-note { color: var(--warn); font-size: 11px; font-weight: 500; margin-top: 2px; }
  .phone-cell { white-space: nowrap; }
  .phone-wrap { display: inline-flex; align-items: center; gap: 6px; }
  .phone-wrap a {
    font-weight: 600;
    color: var(--link);
    text-decoration: none;
    font-variant-numeric: tabular-nums;
  }
  .phone-wrap a:hover { text-decoration: underline; }
  .copy-btn {
    border: 1px solid var(--line);
    background: var(--bg2);
    color: var(--text);
    border-radius: 6px;
    padding: 2px 7px;
    font: inherit;
    font-size: 11px;
    cursor: pointer;
  }
  .copy-btn:hover { background: var(--line); }

  /* Tag / Target pills */
  .tag {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    background: var(--bg2);
    color: var(--text);
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    vertical-align: middle;
  }
  .tag.camp { background: #ebebeb; color: #000000; }
  .tag.adset { background: #e5e5e5; color: #000000; }
  .tag.video { background: #000000; color: #ffffff; font-weight: 700; }
  .tag.empty-tag { background: transparent; color: var(--hint); padding: 0; }

  /* Device model («Qurilma») and browser signals («Tafsilot») */
  .device-cell { white-space: nowrap; font-size: 12px; color: var(--ink); }
  .details-cell { max-width: 260px; white-space: normal; font-size: 11px; line-height: 1.35; color: var(--hint); }
  .details-cell.suspect { color: #000000; font-weight: 700; background: #e5e5e5; }

  /* Status Badges */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .b-wait { background: var(--wait-bg); color: var(--wait); }
  .b-work { background: var(--warn-bg); color: var(--warn); }
  .b-sold { background: var(--ok-bg); color: var(--ok); }
  .b-noanswer { background: var(--info-bg); color: var(--info); }
  .b-callback { background: var(--cb-bg); color: var(--cb); }
  .b-rejected { background: var(--bad-bg); color: var(--bad); }
  .b-spam { background: var(--spam-bg); color: var(--spam); }

  /* Conversion bar in Target table */
  .conv-wrap { display: flex; align-items: center; gap: 8px; min-width: 110px; }
  .conv-bar { flex: 1; height: 7px; background: var(--bg2); border-radius: 999px; overflow: hidden; }
  .conv-fill { height: 100%; background: var(--ok); border-radius: 999px; }
  .conv-val { font-weight: 700; font-size: 12px; min-width: 36px; text-align: right; }

  /* Row Action Buttons */
  .row-acts { display: flex; flex-wrap: wrap; gap: 4px; min-width: 210px; }
  .act-btn {
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    border-radius: 7px;
    padding: 4px 8px;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .act-btn:hover { background: var(--bg2); }
  .act-btn.take { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
  .act-btn.sold { background: var(--ok); color: #fff; border-color: var(--ok); }
  .act-btn.rejected { color: var(--bad); border-color: #a3a3a3; }
  .act-btn.spam { background: var(--spam-bg); color: var(--spam); border-color: #000000; }

  /* Auth / Empty States */
  .empty, .msg { text-align: center; color: var(--hint); padding: 36px 16px; }
  .login-box {
    max-width: 520px;
    margin: 48px auto;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px;
    text-align: center;
  }
  .login-box h2 { margin: 0 0 8px; font-size: 18px; }
  .login-box p { color: var(--hint); font-size: 14px; margin: 0 0 16px; line-height: 1.5; }
  .login-row { display: flex; gap: 8px; }
  .login-row input {
    flex: 1;
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 10px 12px;
    font: inherit;
  }
  .login-row button {
    border: 0;
    background: var(--btn);
    color: var(--btn-text);
    border-radius: 9px;
    padding: 10px 16px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(18px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    background: rgba(0, 0, 0, .9);
    color: #fff;
    padding: 10px 16px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    max-width: 90vw;
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
    z-index: 50;
  }
  .toast.on { opacity: 1; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <h1>📊 Зейнара · Лидлар ва Таргет CRM</h1>
      <span class="meta" id="updated"></span>
    </div>
    <div class="header-controls">
      <div class="seg" id="period">
        <button data-days="1" class="on">Бугун</button>
        <button data-days="3">3 кун</button>
        <button data-days="7">7 кун</button>
        <button data-days="14">14 кун</button>
        <button data-days="30">30 кун</button>
      </div>
      <button class="tool-btn" id="refreshBtn" type="button">🔄 Янгилаш</button>
      <button class="tool-btn" id="csvBtn" type="button">📥 CSV (Excel)</button>
      <button class="tool-btn" id="archiveViewBtn" type="button">🗄 Архив</button>
      <button class="tool-btn" id="archiveBtn" type="button">🧹 Панелни тозалаш</button>
    </div>
  </div>
</header>
<main id="main"><div class="msg">Юкланмоқда…</div></main>
<div class="toast" id="toast"></div>

<script nonce="{{NONCE}}">
(function () {
  'use strict';

  function post(type, data) {
    var payload = data || {};
    try {
      if (window.TelegramWebviewProxy && window.TelegramWebviewProxy.postEvent) window.TelegramWebviewProxy.postEvent(type, JSON.stringify(payload));
      else if (window.external && 'notify' in window.external) window.external.notify(JSON.stringify({ eventType: type, eventData: payload }));
      else if (window.parent !== window) window.parent.postMessage(JSON.stringify({ eventType: type, eventData: payload }), '*');
    } catch (e) { /* browser tab */ }
  }

  var hash = new URLSearchParams(location.hash.slice(1));
  var query = new URLSearchParams(location.search);
  var initData = hash.get('tgWebAppData') || '';
  var webKey = query.get('key') || '';

  try {
    if (initData) sessionStorage.setItem('initData', initData);
    else initData = sessionStorage.getItem('initData') || '';
    if (webKey) {
      localStorage.setItem('bx_crm_key', webKey);
      query.delete('key');
      var cleanUrl = location.pathname + (query.toString() ? '?' + query.toString() : '') + location.hash;
      history.replaceState(null, '', cleanUrl);
    } else {
      webKey = localStorage.getItem('bx_crm_key') || '';
    }
  } catch (e) { /* storage blocked */ }

  try {
    var theme = JSON.parse(hash.get('tgWebAppThemeParams') || '{}');
    var map = { bg_color: '--bg', secondary_bg_color: '--bg2', text_color: '--text', hint_color: '--hint', link_color: '--link', button_color: '--btn', button_text_color: '--btn-text' };
    Object.keys(map).forEach(function (k) { if (theme[k]) document.documentElement.style.setProperty(map[k], theme[k]); });
  } catch (e) { /* default colours */ }
  post('web_app_ready'); post('web_app_expand');

  var STATUS = {
    wait: ['⏳ Олинмаган', 'b-wait', 1],
    work: ['📞 Жараёнда', 'b-work', 2],
    callback: ['⏰ Кейинроқ', 'b-callback', 3],
    noanswer: ['🔁 Кўтармади', 'b-noanswer', 4],
    sold: ['✅ Сотилди', 'b-sold', 5],
    rejected: ['❌ Рад этди', 'b-rejected', 6],
    spam: ['🚫 Спам', 'b-spam', 7]
  };

  var TABS = [
    ['all', 'Ҳаммаси'],
    ['wait', '⏳ Олинмаган'],
    ['mine', '👤 Менда'],
    ['work', '📞 Жараёнда'],
    ['callback', '⏰ Кейинроқ'],
    ['noanswer', '🔁 Кўтармади'],
    ['sold', '✅ Сотилди'],
    ['rejected', '❌ Рад этди'],
    ['spam', '🚫 Спам / шубҳали']
  ];

  var state = {
    days: 1,
    archive: false, // true: the orders moved out by «🧹 Панелни тозалаш»
    tab: 'all',
    q: '',
    fCampaign: '',
    fAdset: '',
    fAd: '',
    fOperator: '',
    targetGroup: 'all', // 'all' | 'adset' | 'ad' | 'campaign'
    targetSortBy: 'sold',
    targetSortDir: 'desc',
    leadSortBy: 'number',
    leadSortDir: 'desc',
    data: null,
    busy: false,
    open: {}
  };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function statusOf(l) { return l.outcome || (l.takerId ? 'work' : 'wait'); }

  var timeFmt = new Intl.DateTimeFormat('ru-RU', { timeZone: 'Asia/Tashkent', hour: '2-digit', minute: '2-digit' });
  var dayFmt = new Intl.DateTimeFormat('ru-RU', { timeZone: 'Asia/Tashkent', day: '2-digit', month: '2-digit' });
  function when(ms) {
    var d = new Date(ms);
    return dayFmt.format(d) + ' ' + timeFmt.format(d);
  }
  function prettyPhone(p) {
    var d = p.replace(/\D/g, '');
    return '+' + d.slice(0, 3) + ' ' + d.slice(3, 5) + ' ' + d.slice(5, 8) + ' ' + d.slice(8, 10) + ' ' + d.slice(10, 12);
  }

  var toastTimer;
  function toast(text) {
    var t = document.getElementById('toast');
    t.textContent = text;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('on'); }, 2600);
  }

  function copy(text, label) {
    function fallback() {
      var a = document.createElement('textarea');
      a.value = text;
      a.style.position = 'fixed';
      a.style.opacity = '0';
      document.body.appendChild(a);
      a.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(a);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(fallback);
    else fallback();
    post('web_app_trigger_haptic_feedback', { type: 'notification', notification_type: 'success' });
    toast(label || 'Рақам нусхаланди');
  }

  function authHeader() {
    if (initData) return 'tma ' + initData;
    if (webKey) return 'web ' + webKey;
    return '';
  }

  function api(path, opts) {
    opts = opts || {};
    var hdr = authHeader();
    opts.headers = Object.assign(hdr ? { authorization: hdr } : {}, opts.headers || {});
    return fetch(path, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (body) {
        if (!r.ok) {
          body._status = r.status;
          throw body;
        }
        return body;
      });
    });
  }

  function showLoginPrompt(errMsg) {
    var m = document.getElementById('main');
    m.textContent = '';
    var box = el('div', 'login-box');
    box.appendChild(el('h2', '', '🔐 Жадвал CRM га кириш'));
    box.appendChild(
      el(
        'p',
        '',
        errMsg ||
          'Бу панелни катта экранда (компьютер ёки браузерда) очиш учун Telegram гуруҳида ёки ботга шахсий хабарда /panel деб ёзинг ва «🖥 Катта экранда очиш» тугмасини босинг (ёки ҳаволани шу ерга ташланг).'
      )
    );
    var row = el('div', 'login-row');
    var inp = el('input');
    inp.type = 'text';
    inp.placeholder = 'Ҳавола ёки калитни киритинг (?key=...)';
    var btn = el('button', '', 'Кириш');
    btn.onclick = function () {
      var val = inp.value.trim();
      if (!val) return;
      try {
        if (val.indexOf('key=') >= 0) {
          var u = new URL(val, location.origin);
          val = u.searchParams.get('key') || val;
        }
        webKey = val;
        localStorage.setItem('bx_crm_key', webKey);
        load();
      } catch (e) {
        webKey = val;
        load();
      }
    };
    row.appendChild(inp);
    row.appendChild(btn);
    box.appendChild(row);
    m.appendChild(box);
  }

  function load() {
    api('/api/panel/data?days=' + state.days + (state.archive ? '&archive=1' : ''))
      .then(function (d) {
        state.data = d;
        render();
        var av = document.getElementById('archiveViewBtn');
        av.textContent = state.archive ? '↩️ Жорий панелга қайтиш' : '🗄 Архив' + (d.archived ? ' (' + d.archived + ')' : '');
        document.getElementById('archiveBtn').hidden = state.archive;
        document.getElementById('updated').textContent = 'Янгиланди: ' + timeFmt.format(new Date()) + (d.me && d.me.name ? ' · 👤 ' + d.me.name : '');
      })
      .catch(function (e) {
        if (e && (e._status === 401 || e.error === 'unauthorized')) {
          showLoginPrompt(
            'Панелни Telegram ичида гуруҳдаги тугма орқали очинг ёки ботга /panel деб ёзиб «🖥 Катта экранда очиш» ҳаволасини олинг.'
          );
        } else {
          var m = document.getElementById('main');
          m.textContent = '';
          m.appendChild(el('div', 'msg', (e && e.message) || 'Маълумотни олиб бўлмади. Интернетни текширинг.'));
        }
      });
  }

  function filteredLeads(leads) {
    var q = state.q.trim().toLowerCase();
    var digits = q.replace(/\D/g, '');
    var me = state.data && state.data.me ? state.data.me.id : 0;

    var list = leads.filter(function (l) {
      var s = statusOf(l);
      if (state.tab === 'mine' && l.takerId !== me) return false;
      if (state.tab === 'spam' && !(s === 'spam' || l.flagged)) return false;
      if (['wait', 'work', 'sold', 'noanswer', 'callback', 'rejected'].indexOf(state.tab) >= 0 && s !== state.tab) return false;

      if (state.fCampaign && (l.campaign || '—') !== state.fCampaign) return false;
      if (state.fAdset && (l.adset || '—') !== state.fAdset) return false;
      if (state.fAd && (l.ad || '—') !== state.fAd) return false;
      if (state.fOperator && (l.takerName || '—') !== state.fOperator) return false;

      if (q) {
        var hay = [
          l.name,
          l.phone,
          String(l.number),
          l.source || '',
          l.platform || '',
          l.campaign || '',
          l.adset || '',
          l.ad || '',
          l.device || '',
          l.details || '',
          l.takerName || ''
        ].join(' ').toLowerCase();
        var matchText = hay.indexOf(q) >= 0;
        var matchDigits = digits.length >= 3 && l.phone.indexOf(digits) >= 0;
        var matchNum = String(l.number) === q.replace('№', '');
        if (!matchText && !matchDigits && !matchNum) return false;
      }
      return true;
    });

    var dir = state.leadSortDir === 'asc' ? 1 : -1;
    var col = state.leadSortBy;
    list.sort(function (a, b) {
      var va, vb;
      if (col === 'number') { va = a.number; vb = b.number; }
      else if (col === 'createdAt') { va = a.createdAt; vb = b.createdAt; }
      else if (col === 'name') { va = a.name.toLowerCase(); vb = b.name.toLowerCase(); }
      else if (col === 'campaign') { va = (a.campaign || '').toLowerCase(); vb = (b.campaign || '').toLowerCase(); }
      else if (col === 'adset') { va = (a.adset || '').toLowerCase(); vb = (b.adset || '').toLowerCase(); }
      else if (col === 'ad') { va = (a.ad || '').toLowerCase(); vb = (b.ad || '').toLowerCase(); }
      else if (col === 'platform') { va = (a.platform || a.source || '').toLowerCase(); vb = (b.platform || b.source || '').toLowerCase(); }
      else if (col === 'device') { va = (a.device || '').toLowerCase(); vb = (b.device || '').toLowerCase(); }
      else if (col === 'details') { va = (a.details || '').toLowerCase(); vb = (b.details || '').toLowerCase(); }
      else if (col === 'status') { va = STATUS[statusOf(a)][2]; vb = STATUS[statusOf(b)][2]; }
      else if (col === 'operator') { va = (a.takerName || '').toLowerCase(); vb = (b.takerName || '').toLowerCase(); }
      else { va = a.number; vb = b.number; }
      if (va < vb) return -1 * dir;
      if (va > vb) return 1 * dir;
      return (b.number - a.number);
    });
    return list;
  }

  function buildTargetRows(leads) {
    var map = {};
    leads.forEach(function (l) {
      var platform = l.platform || (l.source ? l.source.split(' · ')[0] : 'Тўғридан-тўғри');
      var campaign = l.campaign || '—';
      var adset = l.adset || '—';
      var ad = l.ad || '—';
      var key;
      if (state.targetGroup === 'campaign') {
        key = platform + '\0' + campaign;
        adset = 'Барчаси';
        ad = 'Барчаси';
      } else if (state.targetGroup === 'adset') {
        key = platform + '\0' + campaign + '\0' + adset;
        ad = 'Барчаси';
      } else if (state.targetGroup === 'ad') {
        key = platform + '\0' + ad;
        campaign = l.campaign || '—';
        adset = l.adset || '—';
      } else {
        key = platform + '\0' + campaign + '\0' + adset + '\0' + ad;
      }
      if (!map[key]) {
        map[key] = {
          platform: platform,
          campaign: campaign,
          adset: adset,
          ad: ad,
          total: 0,
          wait: 0,
          work: 0,
          sold: 0,
          rejected: 0,
          noanswer: 0,
          callback: 0,
          spam: 0
        };
      }
      var r = map[key];
      r.total++;
      var s = statusOf(l);
      if (s === 'wait') r.wait++;
      else if (s === 'work') r.work++;
      else if (s === 'sold') r.sold++;
      else if (s === 'rejected') r.rejected++;
      else if (s === 'noanswer') r.noanswer++;
      else if (s === 'callback') r.callback++;
      else if (s === 'spam') r.spam++;
    });

    var rows = Object.keys(map).map(function (k) {
      var r = map[k];
      var real = r.total - r.spam;
      r.real = real;
      r.pending = r.wait + r.work + r.noanswer + r.callback;
      r.conversion = real > 0 ? Math.round((r.sold / real) * 100) : 0;
      return r;
    });

    var dir = state.targetSortDir === 'asc' ? 1 : -1;
    var col = state.targetSortBy;
    rows.sort(function (a, b) {
      var va = a[col], vb = b[col];
      if (typeof va === 'string') { va = va.toLowerCase(); vb = vb.toLowerCase(); }
      if (va < vb) return -1 * dir;
      if (va > vb) return 1 * dir;
      return b.sold - a.sold || b.total - a.total;
    });
    return rows;
  }

  function uniqueValues(leads, field) {
    var set = {};
    leads.forEach(function (l) {
      var v = l[field];
      if (v) set[v] = true;
    });
    return Object.keys(set).sort();
  }

  function exportCsv() {
    if (!state.data || !state.data.leads) return;
    var list = filteredLeads(state.data.leads);
    var headers = ['№', 'Вақт', 'Исм', 'Телефон', 'Ҳолат', 'Оператор', 'Манба', 'Кампания', 'Ad Set (Таргет)', 'Видео (Реклама)', 'Қурилма', 'Тафсилот', 'Шубҳали'];
    var rows = [headers.join(',')];
    list.forEach(function (l) {
      var s = STATUS[statusOf(l)][0];
      var cols = [
        l.number,
        when(l.createdAt),
        l.name,
        l.phone,
        s,
        l.takerName || '',
        l.platform || l.source || '',
        l.campaign || '',
        l.adset || '',
        l.ad || '',
        l.device || '',
        l.details || '',
        l.flagged ? 'Ҳа' : ''
      ].map(function (c) {
        var str = String(c == null ? '' : c);
        // A customer can type a name like =HYPERLINK(...): never let Excel read a cell as a formula.
        if (/^[=+\-@\t\r]/.test(str)) str = "'" + str;
        str = str.replace(/"/g, '""');
        return '"' + str + '"';
      });
      rows.push(cols.join(','));
    });
    var blob = new Blob(['\uFEFF' + rows.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'zeynara-leads-' + (state.archive ? 'arxiv-' : '') + state.days + 'kun.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('CSV жадвал юклаб олинди');
  }

        tdName.appendChild(el('div', '', l.name));
        if (l.flagged) tdName.appendChild(el('div', 'flag-note', '⚠️ Шубҳали белги бор'));
        tr.appendChild(tdName);

        // 4. Phone + Copy
        var tdPhone = el('td', 'phone-cell');
        var pw = el('div', 'phone-wrap');
        var a = el('a', '', prettyPhone(l.phone));
        a.href = 'tel:' + l.phone;
        var cp = el('button', 'copy-btn', 'Нусха');
        cp.onclick = function () { copy(l.phone); };
        pw.appendChild(a);
        pw.appendChild(cp);
        tdPhone.appendChild(pw);
        tr.appendChild(tdPhone);

        // 5. Campaign
        var tdCamp = el('td');
        tdCamp.appendChild(el('span', l.campaign ? 'tag camp' : 'tag empty-tag', l.campaign || '—'));
        tr.appendChild(tdCamp);

        // 6. Ad Set
        var tdAdset = el('td');
        tdAdset.appendChild(el('span', l.adset ? 'tag adset' : 'tag empty-tag', l.adset || '—'));
        tr.appendChild(tdAdset);

        // 7. Video / Ad
        var tdAd = el('td');
        tdAd.appendChild(el('span', l.ad ? 'tag video' : 'tag empty-tag', l.ad || '—'));
        tr.appendChild(tdAd);

        // 7b. Device model («Qurilma»)
        tr.appendChild(el('td', 'device-cell', l.device || '—'));

        // 7c. Browser signals («Tafsilot»)
        var tdDet = el('td', 'details-cell', l.details || '—');
        if (l.details && /webdriver|бот/i.test(l.details)) tdDet.className = 'details-cell suspect';
        tr.appendChild(tdDet);

        // 8. Platform / Source
        var platform = l.platform || (l.source ? l.source.split(' · ')[0] : '—');
        tr.appendChild(el('td', '', platform));

        // 9. Status badge
        var tdStatus = el('td');
        tdStatus.appendChild(el('span', 'badge ' + STATUS[s][1], STATUS[s][0]));
        tr.appendChild(tdStatus);

        // 10. Operator
        var tdOp = el('td', '', l.takerName || '—');
        tr.appendChild(tdOp);

        // 11. Actions
        var tdActs = el('td');
        var acts = el('div', 'row-acts');
        var mine = l.takerId === me;
        var closed = l.outcome && l.outcome !== 'noanswer' && l.outcome !== 'callback';

        function btn(text, cls, action) {
          var b = el('button', 'act-btn' + (cls ? ' ' + cls : ''), text);
          b.onclick = function () { act(l, action); };
          acts.appendChild(b);
        }

        if (!l.takerId) {
          btn('📞 Олиш', 'take', 'take');
          btn('✅ Сотилди', 'sold', 'sold');
          btn('🚫 Спам', 'spam', 'spam');
        } else if (mine && closed && !state.open[l.number]) {
          var edit = el('button', 'act-btn', '✏️ Ўзгартириш');
          edit.onclick = function () { state.open[l.number] = true; renderLeadsTable(container); };
          acts.appendChild(edit);
        } else if (mine) {
          btn('✅ Сотилди', 'sold', 'sold');
          btn('❌ Рад', 'rejected', 'rejected');
          btn('🔁 Кўтармади', '', 'noanswer');
          btn('⏰ Кейинроқ', '', 'callback');
          btn('🚫 Спам', 'spam', 'spam');
          btn('↩️ Қайтариш', '', 'release');
        } else {
          btn('↩️ Қайтариш (' + l.takerName + ')', '', 'release');
        }
        tdActs.appendChild(acts);
        tr.appendChild(tdActs);

        tbody.appendChild(tr);
      });
    }
    table.appendChild(tbody);
    container.appendChild(table);
  }

  document.getElementById('period').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    state.days = Number(b.getAttribute('data-days'));
    Array.prototype.forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); });
    load();
  });
  document.getElementById('refreshBtn').addEventListener('click', function () { load(); });
  document.getElementById('csvBtn').addEventListener('click', function () { exportCsv(); });
  document.getElementById('archiveBtn').addEventListener('click', function () { archiveAll(); });
  document.getElementById('archiveViewBtn').addEventListener('click', function () {
    state.archive = !state.archive;
    resetFilters();
    load();
  });

  load();
  setInterval(function () { if (!document.hidden && !state.busy) load(); }, 30000);
})();
</script>
</body>
</html>
