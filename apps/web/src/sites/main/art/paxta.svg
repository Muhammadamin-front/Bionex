<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56">
  <!-- The paxta-guli net: diagonal threads meeting under every boll. -->
  <g stroke="#8dbfeb" stroke-width="1.5" fill="none">
    <path d="M0 0 56 56M56 0 0 56"/>
    <path d="M-2 4.5 51.5 58M4.5-2 58 51.5M58 4.5 4.5 58M51.5-2-2 51.5" stroke-width=".8" opacity=".7"/>
  </g>
  <!-- Bracts behind the boll. -->
  <g fill="#5a9bd8" transform="translate(28 28)">
    <path d="M0 0C3.4-3.4 9-3.6 12.5 0 9 3.6 3.4 3.4 0 0Z" transform="rotate(45)"/>
    <path d="M0 0C3.4-3.4 9-3.6 12.5 0 9 3.6 3.4 3.4 0 0Z" transform="rotate(135)"/>
    <path d="M0 0C3.4-3.4 9-3.6 12.5 0 9 3.6 3.4 3.4 0 0Z" transform="rotate(225)"/>
    <path d="M0 0C3.4-3.4 9-3.6 12.5 0 9 3.6 3.4 3.4 0 0Z" transform="rotate(315)"/>
  </g>
  <!-- The open boll: four soft lobes. -->
  <g fill="#fff" stroke="#1d68b3" stroke-width="1.1" transform="translate(28 28)">
    <circle cx="0" cy="-4.4" r="4.6"/>
    <circle cx="4.4" cy="0" r="4.6"/>
    <circle cx="0" cy="4.4" r="4.6"/>
    <circle cx="-4.4" cy="0" r="4.6"/>
    <circle cx="0" cy="0" r="2.6" stroke="none"/>
  </g>
  <!-- Small rosettes where the net meets at the corners. -->
  <g fill="#5a9bd8">
    <circle cx="0" cy="0" r="2.4"/><circle cx="56" cy="0" r="2.4"/><circle cx="0" cy="56" r="2.4"/><circle cx="56" cy="56" r="2.4"/>
  </g>
</svg>
